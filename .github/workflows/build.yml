
name: TL 120Hz APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug and Release APK
        run: |
          gradle --no-daemon clean assembleDebug assembleRelease

      - name: Prepare APK Files
        run: |
          mkdir -p output

          cp app/build/outputs/apk/debug/app-debug.apk \
            output/TL120Hz-debug.apk

          cp app/build/outputs/apk/release/app-release.apk \
            output/TL120Hz-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TL120Hz-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
          
