name: TL 120Hz - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build TL 120Hz APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Validate Project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK Files
        run: |
          mkdir -p output

          cp app/build/outputs/apk/debug/app-debug.apk \
            output/TL120Hz-debug.apk

          cp app/build/outputs/apk/release/app-release.apk \
            output/TL120Hz-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TL120Hz-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30   
