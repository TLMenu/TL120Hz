name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Variante "nur ZIP hochgeladen": entpacken. Liegt das Projekt direkt im Repo, wird nichts entpackt.
      - name: Projekt finden
        shell: bash
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls ./*.zip | head -1)
            echo "Entpacke $ZIP"
            mkdir -p _proj && unzip -q "$ZIP" -d _proj
          fi
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projektordner: $DIR"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android-SDK vorbereiten (Lizenzen, Plattform 37)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            # Build-Tools 36.0.0 ist der Standard von AGP 9.5; so muss beim Build nichts nachgeladen werden.
            "$SDKM" "platforms;android-37.2" "build-tools;36.0.0"
          fi
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Debug-APK bauen
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Fehler-Zusammenfassung (nur bei Fehlschlag)
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build-Fehler (zum Kopieren)'
            echo '```'
            grep -E "^e: |error:|What went wrong|Execution failed|Could not |Unresolved|FAILED" -A2 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TL120Hz-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
